[package]
name = "nyx-ui"
version = "0.0.0"
description = "Interfaz de Nyx: proceso principal (bandeja, ventanas) que lanza el núcleo Python"
authors = ["Tepnyx"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# El sufijo _lib evita un conflicto de nombres con el binario en Windows (cargo#8519).
name = "nyx_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
tauri-plugin-notification = "2"
velopack = "1.2.161"
# Motor de cristal compartido con el instalador (9.08).
nyx-glass = { path = "../../crates/nyx-glass" }
# Huella del paquete guardado para volver atrás (rollback.rs).
sha2 = "0.10"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# Misma versión que usa Tauri para no compilar dos copias.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  # Motor de cristal (src/glass): Direct3D 11, captura y composición de Windows.
  "Foundation",
  "Foundation_Numerics",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }
# Vector2 de la composición de Windows (misma versión que trae `windows`; MIT/Apache-2.0).
windows-numerics = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
