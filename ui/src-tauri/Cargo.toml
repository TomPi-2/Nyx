[package]
name = "nyx-ui"
version = "0.0.0"
description = "Interfaz de Nyx: proceso principal (bandeja, ventanas) que lanza el núcleo Python"
authors = ["Tepnyx"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# El sufijo _lib evita un conflicto de nombres con el binario en Windows (cargo#8519).
name = "nyx_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
# Misma versión que usa Tauri para no compilar dos copias.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
