[package]
name = "nyx-installer"
version = "0.0.0"
description = "Instalador de Nyx (tarea 9.08): instala la app con Velopack, el oído y la voz, y abre Nyx"
authors = ["Tepnyx"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "nyx_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "fs"] }
sha2 = "0.10"
ureq = "3"
# El motor de cristal de la app (9.08).
nyx-glass = { path = "../../crates/nyx-glass" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
