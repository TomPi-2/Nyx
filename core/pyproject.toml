[project]
name = "nyx"
version = "0.0.0"
description = "Núcleo de Nyx: asistente de voz local para Windows 11"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
# Las dependencias de cada fase se añaden al aprobar su plan (ver CLAUDE.md).
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
nyx = "nyx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
