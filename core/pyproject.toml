[project]
name = "nyx"
version = "0.0.0"
description = "Núcleo de Nyx: asistente de voz local para Windows 11"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
# Las dependencias de cada fase se añaden al aprobar su plan (ver CLAUDE.md).
dependencies = [
    "comtypes>=1.4.17",
    "httpx>=0.27",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "piper-tts>=1.8.0",
    "pocket-tts>=4.0.1",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pydantic>=2.9",
    "pywin32>=312",
    "rapidfuzz>=3.14.6",
    "screen-brightness-control>=0.27.2",
    "send2trash>=2.1.0",
    "sounddevice>=0.5.6",
    "vosk>=0.3.45",
    "watchdog>=7.1.0",
    "websockets>=14",
    "winrt-windows-devices-geolocation>=4!10.0.28000.2957",
    "winrt-windows-devices-radios>=4!10.0.28000.2957",
    "winrt-windows-foundation>=4!10.0.28000.2957",
    "winrt-windows-media-control>=4!10.0.28000.2957",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pywin32>=312.0.0.20261104",
    "types-psutil>=7.2.2.20260906",
    "types-send2trash>=2.1.0.20260408",
    "onnx>=1.23.2",
    "pillow>=13.0.0",
]

[project.scripts]
nyx = "nyx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyx"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "SIM", "RUF"]
# Textos en español: guiones, comillas latinas y signos de apertura son intencionados.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Las reglas del router son expresiones regulares: se leen mejor en una línea.
"nyx/brain/router/*.py" = ["E501"]
# Tablas de ejemplos para el LoRA (6.27): se leen mejor en una línea.
"training/llm/make_dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# La caché de uv está en una carpeta sincronizada con la nube: los hardlinks fallan (os error 396).
link-mode = "copy"

[[tool.mypy.overrides]]
# Librerías sin anotaciones de tipos: se usan detrás de las interfaces de nyx.
module = ["sounddevice", "vosk", "onnxruntime", "onnxruntime.*", "piper", "piper.*", "pocket_tts", "pocket_tts.*", "comtypes", "comtypes.*", "pycaw", "pycaw.*", "mss", "mss.*", "screen_brightness_control", "screen_brightness_control.*"]
ignore_missing_imports = true
