[project]
name = "nyx"
version = "0.0.0"
description = "Núcleo de Nyx: asistente de voz local para Windows 11"
requires-python = ">=3.12,<3.13"
# Las dependencias de cada fase se añaden al aprobar su plan (ver CLAUDE.md).
dependencies = [
    "httpx>=0.27",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pydantic>=2.9",
    "sounddevice>=0.5.6",
    "vosk>=0.3.45",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
nyx = "nyx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "SIM", "RUF"]
# Textos en español: guiones, comillas latinas y signos de apertura son intencionados.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# La caché de uv está en una carpeta sincronizada con la nube: los hardlinks fallan (os error 396).
link-mode = "copy"

[[tool.mypy.overrides]]
# Librerías sin anotaciones de tipos: se usan detrás de las interfaces de nyx.
module = ["sounddevice", "vosk", "onnxruntime", "onnxruntime.*", "kokoro_onnx"]
ignore_missing_imports = true
